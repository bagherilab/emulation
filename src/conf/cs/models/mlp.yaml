mlp:
  continuous:
    alpha:
      type: float
      range: [0.0001, 1]
      search: log
  discrete:
    activation:
      - logistic
      - relu
    hidden_layer_sizes:
      - (5,)
      - (5,5)
      - (5,10)
      - (25,)
      - (25, 25)
      - (25, 50)
  static:
    solver: adam
    max_iter: 2000
